name: Agent learning and delivery contract

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify authoritative agent and skill versions
        run: python3 scripts/check_agent_fidelity.py
      - name: Verify final-delivery refusal and review cases
        run: python3 -m unittest discover -s tests -p 'test_agent_*.py'
      - name: Verify source freshness, recovery, and execution limits
        run: |
          python3 -m unittest discover -s tests -p "test_evidence_manifest.py"
          python3 -m unittest discover -s tests -p "test_execution_control.py"
      - name: Verify learning promotion and recurrence evidence
        run: python3 scripts/test_learning_evidence.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify companion cancellation and delivery integrity
        run: node --test companion/tests/*.test.js
